<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الإعدادات ⚙️</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #111;
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        header h1 {
            color: gold;
        }

        .settings {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        .setting {
            background: #1b1b1b;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting h3 {
            margin-bottom: 5px;
        }

        .setting p {
            color: #aaa;
        }

        button {
            background: gold;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        body.light-mode {
            background: #f5f5f5;
            color: #111;
        }

        body.light-mode .setting {
            background: white;
        }

        body.light-mode .setting p {
            color: #555;
        }

    </style>
</head>

<body>

    <header>
        <h1 id="setting.titel">⚙️ الإعدادات</h1>
    </header>

    <main class="settings">

        <div class="setting">
    <div>
        <h3 id="appearance-title">🌙 المظهر</h3>
        <p id="appearance-description">تغيير الوضع الليلي أو الفاتح</p>
    </div>

    <button class="theme-button" onclick="toggleTheme()">
        🌙
    </button>
</div>
        </div>

    </main>

    <script src="theme.js"></script>

</body>
</html>
