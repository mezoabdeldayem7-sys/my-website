<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>القوانين 📐</title>

    <style>

        * {
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
        }

        /* ===== الشريط العلوي ===== */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 18px 8%;

            background: #141414;

            border-bottom: 1px solid #333;
        }

        header h2 {
            margin: 0;
            color: gold;
        }

        header a {
            color: white;
            text-decoration: none;

            padding: 10px 18px;

            border: 1px solid #444;
            border-radius: 20px;

            transition: 0.3s;
        }

        header a:hover {
            color: black;
            background: gold;
        }

        /* ===== المحتوى ===== */

        .laws {
            min-height: 80vh;

            padding: 70px 8%;

            text-align: center;
        }

        .laws h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .laws h1 span {
            color: gold;
        }

        .laws > p {
            color: #bbb;
            font-size: 18px;
            line-height: 1.8;
        }

        /* ===== الكروت ===== */

        .cards {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;

            gap: 25px;

            margin-top: 50px;
        }

        .card {
            width: 280px;

            padding: 30px;

            background: #181818;

            border: 1px solid #333;

            border-radius: 18px;

            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: gold;
        }

        .icon {
            font-size: 50px;
        }

        .card h3 {
            color: gold;
            font-size: 24px;
        }

        .card p {
            color: #bbb;
            line-height: 1.7;
        }

        .main-button {
            display: inline-block;

            padding: 12px 25px;

            border: none;
            border-radius: 25px;

            background: gold;
            color: black;

            text-decoration: none;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .main-button:hover {
            transform: scale(1.05);
            background: white;
        }

        /* ===== الفوتر ===== */

        footer {
            padding: 25px;

            text-align: center;

            background: #080808;

            color: #888;
        }

        /* ===== الموبايل ===== */

        @media (max-width: 700px) {

            header {
                padding: 15px 5%;
            }

            .laws h1 {
                font-size: 32px;
            }

            .card {
                width: 90%;
                max-width: 300px;
            }

        }

        /* ===== الوضع الفاتح ===== */

        body.light-mode {
            background: #f5f5f5;
            color: #111;
        }

        body.light-mode header {
            background: white;
            border-bottom-color: #ddd;
        }

        body.light-mode header a {
            color: #111;
            border-color: #ccc;
        }

        body.light-mode .laws > p {
            color: #555;
        }

        body.light-mode .card {
            background: white;
            border-color: #ddd;
        }

        body.light-mode .card p {
            color: #555;
        }

        body.light-mode footer {
            background: #eee;
            color: #666;
        }

    </style>

</head>


<body>


    <!-- ===== الشريط العلوي ===== -->

    <header>

        <h2>📐 القوانين</h2>

        <a href="physics.html">
            الفيزياء
        </a>

    </header>


    <!-- ===== القوانين ===== -->

    <section class="laws">

        <h1>
            قوانين <span>الفيزياء</span> 📐
        </h1>

        <p>
            اختر الباب الذي تريد مذاكرة قوانينه.
        </p>


        <div class="cards">


            <!-- ===== الباب الأول ===== -->

            <div class="card">

                <div class="icon">
                    ⚡
                </div>

                <h3>
                    قوانين الباب الأول
                </h3>

                <p>
                    جميع قوانين الباب الأول في الكهربية
                    بطريقة منظمة وسهلة للمذاكرة.
                </p>

                <a href="laws1.html" class="main-button">
                    دخول القوانين
                </a>

            </div>


        </div>

    </section>


    <!-- ===== الفوتر ===== -->

    <footer>

        جميع الحقوق محفوظة © 2026

    </footer>


    <script src="theme.js"></script>

</body>

</html>
